<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no"/>
<title>太鼓 DRUM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Cinzel:wght@400;600;700&family=Rajdhani:wght@500;700&display=swap');
:root{
  --don:#ff3a1a;--don2:#ff7755;--don-glow:rgba(255,58,26,0.6);
  --ka:#1a6aff;--ka2:#4499ff;--ka-glow:rgba(26,106,255,0.6);
  --bg:#08060e;--gold:#c8952a;--gold2:#f0c060;
  --text:#e8e0d0;--text2:#a09080;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;background:var(--bg);font-family:'Rajdhani',sans-serif;color:var(--text);overflow:hidden;touch-action:none;}
.screen{position:fixed;inset:0;}
.screen.hidden{display:none!important;}

/* ── MENU ── */
#screen-menu{
  background:radial-gradient(ellipse at 50% 40%,#1a0a28 0%,#08060e 65%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.menu-title{font-family:'Cinzel Decorative',serif;font-size:clamp(22px,6vw,48px);font-weight:900;color:var(--gold2);text-shadow:0 0 30px var(--gold),0 0 60px rgba(200,149,42,.4);letter-spacing:6px;text-align:center;margin-bottom:6px;}
.menu-sub{font-family:'Cinzel',serif;font-size:12px;letter-spacing:8px;color:var(--text2);text-align:center;margin-bottom:48px;}
.menu-btn{background:transparent;border:1px solid rgba(200,149,42,.4);color:var(--gold2);font-family:'Cinzel',serif;font-size:13px;font-weight:700;letter-spacing:3px;padding:14px 48px;cursor:pointer;transition:all .2s;margin:6px;}
.menu-btn:hover{border-color:var(--gold2);transform:scale(1.03);background:rgba(200,149,42,.08);}
.star{position:absolute;border-radius:50%;pointer-events:none;animation:twinkle var(--d,3s) ease-in-out infinite var(--delay,0s);}
@keyframes twinkle{0%,100%{opacity:.1;transform:scale(1)}50%{opacity:.7;transform:scale(1.3)}}
.menu-drum-wrap{margin-bottom:32px;animation:drumFloat 3s ease-in-out infinite;}
@keyframes drumFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}

/* ── SONG SELECT ── */
#screen-songs{display:flex;flex-direction:column;background:linear-gradient(160deg,#100818 0%,#08060e 60%);overflow:hidden;}
#songs-topbar{flex-shrink:0;background:rgba(0,0,0,.4);border-bottom:1px solid rgba(200,149,42,.2);padding:12px 20px;display:flex;align-items:center;gap:16px;}
#songs-topbar-title{font-family:'Cinzel',serif;font-size:14px;letter-spacing:4px;color:var(--gold2);}
.back-btn{background:none;border:1px solid rgba(200,149,42,.3);color:var(--text2);font-family:'Cinzel',serif;font-size:10px;letter-spacing:2px;padding:6px 14px;cursor:pointer;transition:all .15s;}
.back-btn:hover{border-color:var(--gold);color:var(--gold2);}
#songs-list{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin;scrollbar-color:#2a1a08 transparent;}
.song-card{background:linear-gradient(135deg,#120c1e,#0e0816);border:1px solid rgba(200,149,42,.15);border-radius:4px;padding:16px 18px;cursor:default;transition:border-color .15s;}
.sc-title{font-family:'Cinzel',serif;font-size:16px;color:var(--text);margin-bottom:4px;}
.sc-artist{font-size:13px;color:var(--text2);margin-bottom:8px;}
.sc-diffs{display:flex;gap:8px;flex-wrap:wrap;}
.diff-pill{border:1px solid;border-radius:2px;padding:3px 12px;font-family:'Cinzel',serif;font-size:10px;font-weight:700;cursor:pointer;letter-spacing:1px;transition:all .15s;background:transparent;}
.diff-pill.Easy{color:#44ff88;border-color:#44ff88;}.diff-pill.Easy:hover{background:rgba(68,255,136,.15);}
.diff-pill.Normal{color:#ffd93d;border-color:#ffd93d;}.diff-pill.Normal:hover{background:rgba(255,217,61,.15);}
.diff-pill.Hard{color:#ff9944;border-color:#ff9944;}.diff-pill.Hard:hover{background:rgba(255,153,68,.15);}
.diff-pill.Legend{color:#ff4488;border-color:#ff4488;}.diff-pill.Legend:hover{background:rgba(255,68,136,.15);}
.no-songs{color:var(--text2);font-size:15px;text-align:center;padding:48px 24px;line-height:2.2;border:1px dashed rgba(200,149,42,.2);border-radius:4px;}
#loading-msg{text-align:center;padding:32px;font-family:'Cinzel',serif;color:var(--text2);letter-spacing:2px;}

/* ── GAME ── */
#screen-game{background:#000;display:flex;flex-direction:column;}
#game-canvas{display:block;flex:1;min-height:0;}
#touch-wrap{flex-shrink:0;display:flex;height:120px;position:relative;}
.touch-zone{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;touch-action:manipulation;user-select:none;transition:background .08s;position:relative;overflow:hidden;}
.touch-zone::before{content:'';position:absolute;inset:0;opacity:0;transition:opacity .08s;}
.tz-ka-l,.tz-ka-r{background:rgba(26,106,255,.08);border-top:2px solid rgba(26,106,255,.4);}
.tz-don-l,.tz-don-r{background:rgba(255,58,26,.08);border-top:2px solid rgba(255,58,26,.4);}
.tz-ka-l::before,.tz-ka-r::before{background:rgba(26,106,255,.25);}
.tz-don-l::before,.tz-don-r::before{background:rgba(255,58,26,.25);}
.touch-zone.pressed::before{opacity:1;}
.tz-label{font-family:'Cinzel',serif;font-size:11px;font-weight:700;letter-spacing:2px;position:relative;z-index:1;}
.tz-ka-l .tz-label,.tz-ka-r .tz-label{color:var(--ka2);}
.tz-don-l .tz-label,.tz-don-r .tz-label{color:var(--don2);}
.tz-icon{font-size:24px;position:relative;z-index:1;}
.tz-hint{font-size:9px;color:rgba(255,255,255,.25);letter-spacing:1px;position:relative;z-index:1;}
#hud{position:absolute;top:0;left:0;right:0;padding:8px 16px 0;background:linear-gradient(to bottom,rgba(0,0,0,.75),transparent);pointer-events:none;z-index:20;display:flex;align-items:flex-start;gap:12px;}
#hud-left{flex:1;}
#hud-song-title{font-family:'Cinzel',serif;font-size:12px;color:rgba(255,255,255,.6);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#hud-score{font-family:'Cinzel Decorative',serif;font-size:22px;font-weight:700;color:var(--gold2);text-shadow:0 0 12px var(--gold);letter-spacing:2px;line-height:1.1;}
#hud-right{text-align:right;}
#hud-combo{font-family:'Cinzel',serif;font-size:13px;color:rgba(255,255,255,.5);letter-spacing:1px;min-height:18px;}
#hud-multi{font-family:'Cinzel',serif;font-size:18px;font-weight:700;color:#888;transition:color .2s,text-shadow .2s;}
#life-wrap{position:absolute;bottom:124px;left:50%;transform:translateX(-50%);width:min(300px,75vw);pointer-events:none;z-index:20;}
#life-bar-bg{height:6px;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.1);border-radius:3px;overflow:hidden;}
#life-bar-fill{height:100%;width:100%;background:linear-gradient(to right,#ff2200,#ff8800,#44ff88);border-radius:3px;transition:width .15s;}
#life-souls{display:flex;justify-content:center;gap:5px;margin-top:3px;}
.soul{font-size:10px;transition:filter .2s;}.soul.empty{filter:grayscale(1) opacity(.3);}
#progress-bar{position:absolute;top:0;left:0;right:0;height:3px;z-index:25;pointer-events:none;background:rgba(255,255,255,.05);}
#progress-fill{height:100%;background:linear-gradient(to right,var(--don),var(--ka));transition:width .1s linear;}
#pause-btn{position:absolute;top:8px;right:12px;z-index:30;background:rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.15);color:rgba(255,255,255,.5);font-size:12px;padding:6px 12px;cursor:pointer;font-family:'Cinzel',serif;letter-spacing:1px;pointer-events:all;transition:all .15s;}
#pause-btn:hover{color:var(--gold2);border-color:var(--gold);}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;z-index:50;}
.overlay.hidden{display:none;}
.overlay-title{font-family:'Cinzel Decorative',serif;font-size:28px;color:var(--gold2);letter-spacing:4px;text-shadow:0 0 20px var(--gold);}
.overlay-title.danger{color:var(--don);text-shadow:0 0 30px var(--don-glow);animation:goPulse 1.4s ease-in-out infinite;}
.overlay-title.success{color:#44ff88;text-shadow:0 0 20px rgba(68,255,136,.6);}
.overlay-title.fc{color:var(--gold2);text-shadow:0 0 30px var(--gold);}
@keyframes goPulse{0%,100%{opacity:1}50%{opacity:.5}}
.overlay-sub{font-family:'Cinzel',serif;font-size:13px;color:var(--text2);letter-spacing:2px;text-align:center;line-height:2;}
.overlay-btn{background:transparent;border:1px solid rgba(200,149,42,.4);color:var(--text);font-family:'Cinzel',serif;font-size:11px;letter-spacing:3px;padding:11px 28px;cursor:pointer;transition:all .15s;margin:3px;}
.overlay-btn:hover{border-color:var(--gold2);color:var(--gold2);}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin:8px 0;}
.res-item{text-align:center;}
.res-val{font-family:'Cinzel',serif;font-size:22px;font-weight:700;}
.res-lbl{font-size:11px;color:var(--text2);letter-spacing:2px;margin-top:2px;}
.judge-float{position:absolute;pointer-events:none;z-index:40;font-family:'Cinzel',serif;font-weight:700;text-align:center;animation:judgeAnim .7s ease forwards;}
@keyframes judgeAnim{0%{opacity:1;transform:translateX(-50%) scale(1.3) translateY(0)}40%{opacity:1;transform:translateX(-50%) scale(1) translateY(-8px)}100%{opacity:0;transform:translateX(-50%) scale(.9) translateY(-40px)}}
</style>
</head>
<body>

<!-- ══ MENU ══ -->
<div class="screen" id="screen-menu">
  <div class="menu-drum-wrap"><canvas id="menu-drum-canvas" width="180" height="180"></canvas></div>
  <div class="menu-title">太鼓 DRUM</div>
  <div class="menu-sub">RHYTHM GAME</div>
  <button class="menu-btn" onclick="showSongs()"><span>🥁 GIOCA</span></button>
</div>

<!-- ══ SONG SELECT ══ -->
<div class="screen hidden" id="screen-songs">
  <div id="songs-topbar">
    <button class="back-btn" onclick="showScreen('menu')">← MENU</button>
    <span id="songs-topbar-title">SELEZIONA CANZONE</span>
  </div>
  <div id="songs-list"><div id="loading-msg">Caricamento canzoni...</div></div>
</div>

<!-- ══ GAME ══ -->
<div class="screen hidden" id="screen-game">
  <canvas id="game-canvas"></canvas>
  <div id="progress-bar"><div id="progress-fill" style="width:0%"></div></div>
  <div id="hud">
    <div id="hud-left">
      <div id="hud-song-title">—</div>
      <div id="hud-score">0</div>
    </div>
    <div id="hud-right">
      <div id="hud-combo"></div>
      <div id="hud-multi">×1</div>
    </div>
  </div>
  <div id="life-wrap">
    <div id="life-bar-bg"><div id="life-bar-fill"></div></div>
    <div id="life-souls">
      <span class="soul" id="soul0">❤</span>
      <span class="soul" id="soul1">❤</span>
      <span class="soul" id="soul2">❤</span>
    </div>
  </div>
  <button id="pause-btn" onclick="togglePause()">⏸</button>
  <div id="touch-wrap">
    <div class="touch-zone tz-ka-l"  data-type="ka"><div class="tz-icon">👈</div><div class="tz-label">KA</div><div class="tz-hint">BORDO SX</div></div>
    <div class="touch-zone tz-don-l" data-type="don"><div class="tz-icon">🥁</div><div class="tz-label">DON</div><div class="tz-hint">CENTRO SX</div></div>
    <div class="touch-zone tz-don-r" data-type="don"><div class="tz-icon">🥁</div><div class="tz-label">DON</div><div class="tz-hint">CENTRO DX</div></div>
    <div class="touch-zone tz-ka-r"  data-type="ka"><div class="tz-icon">👉</div><div class="tz-label">KA</div><div class="tz-hint">BORDO DX</div></div>
  </div>
  <!-- Pause -->
  <div class="overlay hidden" id="pause-overlay">
    <div class="overlay-title">PAUSA</div>
    <button class="overlay-btn" onclick="togglePause()">▶ RIPRENDI</button>
    <button class="overlay-btn" onclick="restartGame()">↩ RIPROVA</button>
    <button class="overlay-btn" onclick="quitGame()">✕ ESCI</button>
  </div>
  <!-- Game Over -->
  <div class="overlay hidden" id="gameover-overlay">
    <div class="overlay-title danger">GAME OVER</div>
    <div class="overlay-sub" id="go-stats"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
      <button class="overlay-btn" onclick="restartGame()">↩ RIPROVA</button>
      <button class="overlay-btn" onclick="quitGame()">🏠 MENU</button>
    </div>
  </div>
  <!-- Results -->
  <div class="overlay hidden" id="results-overlay">
    <div class="overlay-title" id="res-title">COMPLETO!</div>
    <div class="overlay-sub" id="res-song"></div>
    <div class="res-grid" id="res-grid"></div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px">
      <button class="overlay-btn" onclick="restartGame()">↩ RIGIOCA</button>
      <button class="overlay-btn" onclick="quitGame()">🏠 MENU</button>
    </div>
  </div>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// CONFIG — cambia REPO_BASE con il tuo username/repo
// ═══════════════════════════════════════════════════════════
const REPO_BASE = 'https://raw.githubusercontent.com/CarmineVarone/rythmjs/main';
const CATALOG_URL = REPO_BASE + '/catalog.json';

// ═══════════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════════
const DIFF_ORDER  = ['Easy','Normal','Hard','Legend'];
const NOTE_SPEED  = 520;
const HIT_X_FRAC  = 0.22;
const PERFECT_MS  = 55;
const GREAT_MS    = 110;
const GOOD_MS     = 170;
const MISS_MS     = 220;
const SCORE_PERFECT = 300;
const SCORE_GREAT   = 200;
const SCORE_GOOD    = 100;
const LIFE_MAX    = 100;
const LIFE_DRAIN  = 10;
const LIFE_GAIN   = 1.5;
const MULTI_THR   = [10,20,30];
const DON_COLOR   = '#ff3a1a';
const DON_COLOR2  = '#ff7755';
const KA_COLOR    = '#1a6aff';
const KA_COLOR2   = '#55aaff';
const GOLD        = '#c8952a';
const GOLD2       = '#f0c060';

// ═══════════════════════════════════════════════════════════
// SCREEN
// ═══════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.add('hidden'));
  document.getElementById('screen-'+id).classList.remove('hidden');
}

// ═══════════════════════════════════════════════════════════
// CATALOG / SONG LIST
// ═══════════════════════════════════════════════════════════
let catalog = []; // array di { id, title, artist, bpm, audioUrl, difficulties:[{diff, mapUrl, noteCount}] }

async function loadCatalog() {
  try {
    const r = await fetch(CATALOG_URL + '?t=' + Date.now());
    catalog = await r.json();
  } catch(e) {
    catalog = [];
    console.warn('Catalog non trovato:', e);
  }
}

async function showSongs() {
  showScreen('songs');
  document.getElementById('songs-list').innerHTML = '<div id="loading-msg">Caricamento canzoni...</div>';
  await loadCatalog();
  renderSongList();
}

function renderSongList() {
  const list = document.getElementById('songs-list');
  if (!catalog.length) {
    list.innerHTML = `<div class="no-songs">
      Nessuna canzone trovata.<br>
      Aggiungi canzoni al repo e aggiorna <b>catalog.json</b>.<br>
      <small style="opacity:.5">Vedi le istruzioni nel README</small>
    </div>`;
    return;
  }
  list.innerHTML = '';
  catalog.forEach(song => {
    const card = document.createElement('div');
    card.className = 'song-card';
    const pillsHTML = song.difficulties
      .sort((a,b) => DIFF_ORDER.indexOf(a.diff)-DIFF_ORDER.indexOf(b.diff))
      .map(d => `<button class="diff-pill ${d.diff}" data-diff="${d.diff}">${d.diff} <span style="opacity:.5;font-size:9px">${d.noteCount||'?'}</span></button>`)
      .join('');
    card.innerHTML = `
      <div class="sc-title">${esc(song.title)}</div>
      <div class="sc-artist">${esc(song.artist)} · ${song.bpm||'?'} BPM</div>
      <div class="sc-diffs">${pillsHTML}</div>
    `;
    card.querySelectorAll('.diff-pill').forEach(p => {
      p.addEventListener('click', () => {
        const diff = p.dataset.diff;
        const d = song.difficulties.find(x => x.diff === diff);
        if (d) startGame(song, d);
      });
    });
    list.appendChild(card);
  });
}

// ═══════════════════════════════════════════════════════════
// MENU DRUM
// ═══════════════════════════════════════════════════════════
const mdc = document.getElementById('menu-drum-canvas').getContext('2d');
let menuDrumHit = 0;

function drawMenuDrum(ts) {
  requestAnimationFrame(drawMenuDrum);
  const w=180,h=180,cx=90,cy=90;
  mdc.clearRect(0,0,w,h);
  const outerR = 72;
  const wg = mdc.createRadialGradient(cx,cy,outerR*.5,cx,cy,outerR);
  wg.addColorStop(0,'#6a3818'); wg.addColorStop(1,'#2a1208');
  mdc.beginPath(); mdc.arc(cx,cy,outerR,0,Math.PI*2);
  mdc.fillStyle=wg; mdc.fill();
  mdc.strokeStyle=GOLD2; mdc.lineWidth=2.5;
  mdc.shadowColor=GOLD; mdc.shadowBlur=menuDrumHit?20:8;
  mdc.stroke(); mdc.shadowBlur=0;
  const kaActive = menuDrumHit===2;
  mdc.beginPath(); mdc.arc(cx,cy,outerR*.82,0,Math.PI*2);
  mdc.strokeStyle=kaActive?KA_COLOR2:'rgba(26,106,255,.35)';
  mdc.lineWidth=outerR*.18;
  mdc.shadowColor=KA_COLOR; mdc.shadowBlur=kaActive?22:4;
  mdc.stroke(); mdc.shadowBlur=0;
  const donR=outerR*.60;
  const donActive=menuDrumHit===1;
  const dg=mdc.createRadialGradient(cx,cy-donR*.2,donR*.1,cx,cy,donR);
  dg.addColorStop(0,donActive?'#ff7755':'#cc3010');
  dg.addColorStop(.6,donActive?'#ff3a1a':'#991808');
  dg.addColorStop(1,'#550800');
  mdc.beginPath(); mdc.arc(cx,cy,donR,0,Math.PI*2);
  mdc.fillStyle=dg; mdc.fill();
  mdc.strokeStyle=donActive?'#ff8866':'rgba(255,80,40,.4)';
  mdc.lineWidth=1.5;
  mdc.shadowColor=DON_COLOR; mdc.shadowBlur=donActive?20:5;
  mdc.stroke(); mdc.shadowBlur=0;
  mdc.save(); mdc.globalAlpha=.1+Math.sin(ts*.003)*.07;
  mdc.beginPath(); mdc.arc(cx,cy,donR*.38,0,Math.PI*2);
  mdc.strokeStyle='#ffaa88'; mdc.lineWidth=1; mdc.stroke(); mdc.restore();
  if(menuDrumHit>0) menuDrumHit=0;
}
requestAnimationFrame(drawMenuDrum);
document.getElementById('menu-drum-canvas').addEventListener('click',()=>{ menuDrumHit=Math.random()>.5?1:2; });

// ═══════════════════════════════════════════════════════════
// GAME STATE
// ═══════════════════════════════════════════════════════════
let gSong=null, gDiff=null, gMap=null, gAudio=null, gNotes=[];
let gRunning=false, gPaused=false, gGameOver=false, gFinished=false;
let gScore=0,gCombo=0,gMaxCombo=0,gTotal=0,gHits=0;
let gPerfect=0,gGreat=0,gGood=0,gMisses=0,gMulti=1,gLife=LIFE_MAX;
let gAnimFrame=null, gLastTs=0;
let gParticles=[], gJudges=[], gDrumHit={type:null,t:0};
let gBigSides={};

// ═══════════════════════════════════════════════════════════
// CANVAS
// ═══════════════════════════════════════════════════════════
const canvas = document.getElementById('game-canvas');
const ctx    = canvas.getContext('2d');

function resizeCanvas() {
  const s = document.getElementById('screen-game');
  canvas.width  = s.clientWidth;
  canvas.height = s.clientHeight - 120;
}
window.addEventListener('resize', () => {
  if (!document.getElementById('screen-game').classList.contains('hidden')) resizeCanvas();
});

// ═══════════════════════════════════════════════════════════
// START GAME
// ═══════════════════════════════════════════════════════════
async function startGame(song, diffObj) {
  // Carica mappa dal repo
  let map;
  try {
    const r = await fetch(diffObj.mapUrl + '?t=' + Date.now());
    map = await r.json();
  } catch { alert('Mappa non trovata!'); return; }
  if (!map.notes?.length) { alert('Nessuna nota in questa mappa.'); return; }

  gSong=song; gDiff=diffObj; gMap=map;
  gNotes=map.notes.map((n,i)=>({...n,idx:i,hit:false,missed:false,bigSides:0}));
  gScore=0;gCombo=0;gMaxCombo=0;gTotal=map.notes.length;
  gHits=0;gPerfect=0;gGreat=0;gGood=0;gMisses=0;
  gMulti=1;gLife=LIFE_MAX;gGameOver=false;gFinished=false;
  gParticles=[];gJudges=[];gBigSides={};
  gDrumHit={type:null,t:0};
  for(let i=0;i<3;i++){const s=document.getElementById('soul'+i);if(s)s.classList.remove('empty');}

  if(gAudio){gAudio.pause();gAudio=null;}
  gAudio = new Audio(song.audioUrl);
  gAudio.crossOrigin = 'anonymous';

  gAudio.addEventListener('canplaythrough', () => {
    resizeCanvas();
    showScreen('game');
    ['pause-overlay','gameover-overlay','results-overlay'].forEach(id=>document.getElementById(id).classList.add('hidden'));
    document.getElementById('hud-song-title').textContent = `${map.title||song.title} — ${map.artist||song.artist}`;
    resetHUD();
    gRunning=true; gPaused=false;
    gAudio.currentTime = Math.max(0, -(map.offset||0)/1000);
    gAudio.play();
    if(gAnimFrame) cancelAnimationFrame(gAnimFrame);
    gLastTs=performance.now();
    gAnimFrame=requestAnimationFrame(gameLoop);
  },{once:true});
  gAudio.load();
}

function getTime() { return (gAudio?.currentTime||0)*1000+(gMap?.offset||0); }

// ═══════════════════════════════════════════════════════════
// GAME LOOP
// ═══════════════════════════════════════════════════════════
function gameLoop(ts) {
  gAnimFrame=requestAnimationFrame(gameLoop);
  if(!gRunning||gPaused||gGameOver) return;
  const dt=Math.min(50,ts-gLastTs); gLastTs=ts;
  const nowMs=getTime();
  const W=canvas.width, H=canvas.height;
  const hitX=W*HIT_X_FRAC;

  // Miss check
  gNotes.forEach(n=>{
    if(n.hit||n.missed) return;
    const end=n.time+(n.duration||0);
    if(nowMs-end>MISS_MS){
      n.missed=true; gMisses++; gCombo=0; gMulti=1;
      gLife=Math.max(0,gLife-LIFE_DRAIN);
      updateHUD();
      if(gLife<=0&&!gGameOver){triggerGameOver();return;}
    }
  });

  // Finished check
  if(!gFinished&&gAudio?.ended){
    const last=gNotes[gNotes.length-1];
    if(nowMs>(last?last.time+(last.duration||0):0)+2000){showResults();return;}
  }

  // Particles
  gParticles=gParticles.filter(p=>{p.life-=dt;return p.life>0;});
  gParticles.forEach(p=>{p.x+=p.vx*dt/16;p.y+=p.vy*dt/16;p.vy+=0.2;});
  gJudges=gJudges.filter(j=>j.age<700);
  gJudges.forEach(j=>j.age+=dt);

  // Progress
  if(gAudio?.duration) document.getElementById('progress-fill').style.width=(gAudio.currentTime/gAudio.duration*100)+'%';

  // ── DRAW ──
  ctx.fillStyle='#050310'; ctx.fillRect(0,0,W,H);
  drawBackground(W,H,nowMs);
  drawHitZone(hitX,H,ts);
  drawDrum(hitX,H,ts);
  drawNotes(W,H,hitX,nowMs);
  drawParticles();
  drawJudgements();
}

function drawBackground(W,H,nowMs){
  const cy=H*.5, th=H*.32;
  const tg=ctx.createLinearGradient(0,cy-th/2,0,cy+th/2);
  tg.addColorStop(0,'rgba(255,255,255,0)');
  tg.addColorStop(.3,'rgba(30,15,50,.6)');
  tg.addColorStop(.7,'rgba(30,15,50,.6)');
  tg.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle=tg; ctx.fillRect(0,cy-th/2,W,th);
  ctx.save(); ctx.globalAlpha=.06;
  ctx.strokeStyle=GOLD; ctx.lineWidth=1;
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  ctx.restore();
  if(gMap){
    const bpm=gMap.bpm||120, bMs=60000/bpm;
    ctx.save(); ctx.globalAlpha=.06;
    for(let b=0;b<300;b++){
      const bx=W*HIT_X_FRAC+(b*bMs-nowMs)/1000*NOTE_SPEED;
      if(bx<0||bx>W) continue;
      ctx.strokeStyle=b%4===0?GOLD:'#ffffff';
      ctx.lineWidth=b%4===0?1:.5;
      ctx.beginPath();ctx.moveTo(bx,cy-th/2);ctx.lineTo(bx,cy+th/2);ctx.stroke();
    }
    ctx.restore();
  }
}

function drawDrum(hitX,H,ts){
  const cx=hitX, cy=H*.5, now=performance.now();
  const age=now-gDrumHit.t, isHit=age<200;
  const ht=gDrumHit.type;
  const outerR=H*.16;
  const wg=ctx.createRadialGradient(cx,cy,outerR*.5,cx,cy,outerR);
  wg.addColorStop(0,'#6a3818');wg.addColorStop(1,'#2a1208');
  ctx.beginPath();ctx.arc(cx,cy,outerR,0,Math.PI*2);
  ctx.fillStyle=wg;ctx.fill();
  ctx.strokeStyle=isHit?GOLD2:GOLD;ctx.lineWidth=3;
  ctx.shadowColor=GOLD;ctx.shadowBlur=isHit?20:8;ctx.stroke();ctx.shadowBlur=0;
  const kaA=isHit&&ht==='ka';
  ctx.beginPath();ctx.arc(cx,cy,outerR*.82,0,Math.PI*2);
  ctx.strokeStyle=kaA?KA_COLOR2:'rgba(26,106,255,.35)';
  ctx.lineWidth=outerR*.18;ctx.shadowColor=KA_COLOR;ctx.shadowBlur=kaA?22:4;
  ctx.stroke();ctx.shadowBlur=0;
  const donR=outerR*.60, donA=isHit&&ht==='don';
  const dg=ctx.createRadialGradient(cx,cy-donR*.2,donR*.1,cx,cy,donR);
  dg.addColorStop(0,donA?'#ff7755':'#cc3010');
  dg.addColorStop(.6,donA?'#ff3a1a':'#991808');
  dg.addColorStop(1,'#550800');
  ctx.beginPath();ctx.arc(cx,cy,donR,0,Math.PI*2);
  ctx.fillStyle=dg;ctx.fill();
  ctx.strokeStyle=donA?'#ff8866':'rgba(255,80,40,.4)';
  ctx.lineWidth=1.5;ctx.shadowColor=DON_COLOR;ctx.shadowBlur=donA?20:5;
  ctx.stroke();ctx.shadowBlur=0;
  if(isHit){
    const rr=outerR*(.6+age/200*.6), alpha=.6*(1-age/200);
    ctx.save();ctx.globalAlpha=alpha;
    ctx.beginPath();ctx.arc(cx,cy,rr,0,Math.PI*2);
    ctx.strokeStyle=ht==='don'?DON_COLOR2:KA_COLOR2;
    ctx.lineWidth=2;ctx.shadowColor=ht==='don'?DON_COLOR:KA_COLOR;ctx.shadowBlur=12;
    ctx.stroke();ctx.restore();
  }
}

function drawHitZone(hitX,H,ts){
  const cy=H*.5;
  ctx.save();ctx.globalAlpha=.2+Math.sin(ts*.004)*.08;
  ctx.strokeStyle='#ffffff';ctx.lineWidth=1;ctx.setLineDash([4,4]);
  ctx.beginPath();ctx.moveTo(hitX,cy-H*.15);ctx.lineTo(hitX,cy+H*.15);
  ctx.stroke();ctx.setLineDash([]);ctx.restore();
}

function drawNotes(W,H,hitX,nowMs){
  const cy=H*.5;
  gNotes.forEach(n=>{
    if(n.hit||n.missed) return;
    const nx=hitX+(n.time-nowMs)/1000*NOTE_SPEED;
    if(nx<-80||nx>W+20) return;
    const isDon=n.type==='don', isBig=n.big===true;
    const c=isDon?DON_COLOR:KA_COLOR, c2=isDon?DON_COLOR2:KA_COLOR2;
    const r=isBig?H*.115:H*.075;
    if(n.duration){
      const te=hitX+(n.time+n.duration-nowMs)/1000*NOTE_SPEED;
      const tx=Math.max(hitX-r,Math.min(nx,W)), tw=Math.max(0,te-tx);
      if(tw>0){
        ctx.save();ctx.fillStyle=c+'55';ctx.strokeStyle=c+'88';ctx.lineWidth=1;
        const tr=r*.5;
        ctx.beginPath();
        if(ctx.roundRect)ctx.roundRect(tx,cy-tr,tw,tr*2,tr);
        else ctx.rect(tx,cy-tr,tw,tr*2);
        ctx.fill();ctx.stroke();ctx.restore();
      }
    }
    const g=ctx.createRadialGradient(nx-r*.3,cy-r*.3,r*.05,nx,cy,r);
    g.addColorStop(0,c2);g.addColorStop(.6,c);g.addColorStop(1,c.replace('ff','88'));
    ctx.beginPath();ctx.arc(nx,cy,r,0,Math.PI*2);
    ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle=c2;ctx.lineWidth=isBig?3:2;
    ctx.shadowColor=c;ctx.shadowBlur=14;ctx.stroke();ctx.shadowBlur=0;
    ctx.save();ctx.globalAlpha=.35;ctx.fillStyle='#ffffff';
    ctx.beginPath();ctx.arc(nx-r*.3,cy-r*.3,r*.28,0,Math.PI*2);ctx.fill();ctx.restore();
    if(isBig){
      ctx.beginPath();ctx.arc(nx,cy,r*1.25,0,Math.PI*2);
      ctx.strokeStyle=c+'66';ctx.lineWidth=2;ctx.stroke();
    }
  });
}

function drawParticles(){
  gParticles.forEach(p=>{
    ctx.save();ctx.globalAlpha=Math.max(0,p.life/p.maxLife);
    ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();ctx.restore();
  });
}

function drawJudgements(){
  gJudges.forEach(j=>{
    const a=Math.max(0,1-j.age/700), y=j.y-j.age*.05;
    ctx.save();ctx.globalAlpha=a;ctx.font=`bold ${j.size}px Cinzel,serif`;
    ctx.fillStyle=j.color;ctx.shadowColor=j.color;ctx.shadowBlur=12;
    ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(j.text,j.x,y);ctx.restore();
  });
}

function spawnParticles(x,y,color,n){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=2+Math.random()*5;
    gParticles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-3,r:2+Math.random()*3,color,life:250+Math.random()*300,maxLife:550});
  }
}

// ═══════════════════════════════════════════════════════════
// HIT LOGIC
// ═══════════════════════════════════════════════════════════
function hitNote(inputType){
  if(!gRunning||gPaused||gGameOver) return;
  const nowMs=getTime();
  const cy=canvas.height*.5, cx=canvas.width*HIT_X_FRAC;
  gDrumHit={type:inputType,t:performance.now()};
  let best=null, bestDt=Infinity, bestIdx=-1;
  gNotes.forEach((n,i)=>{
    if(n.hit||n.missed) return;
    const dt=Math.abs(n.time-nowMs);
    if(dt>=bestDt||dt>=MISS_MS) return;
    if(!n.big&&n.type!==inputType) return;
    bestDt=dt; best=n; bestIdx=i;
  });
  if(!best) return;
  if(best.big){
    best.bigSides=(best.bigSides||0)+1;
    if(best.bigSides<2) return;
  }
  best.hit=true; gHits++; gCombo++;
  if(gCombo>gMaxCombo) gMaxCombo=gCombo;
  gMulti=gCombo>=MULTI_THR[2]?4:gCombo>=MULTI_THR[1]?3:gCombo>=MULTI_THR[0]?2:1;
  gLife=Math.min(LIFE_MAX,gLife+LIFE_GAIN);
  let judge,pts,color,size;
  if(bestDt<=PERFECT_MS){judge='PERFECT!';pts=SCORE_PERFECT;color='#ff88ff';size=26;gPerfect++;}
  else if(bestDt<=GREAT_MS){judge='GREAT';pts=SCORE_GREAT;color='#ffd93d';size=22;gGreat++;}
  else{judge='GOOD';pts=SCORE_GOOD;color='#44ff88';size=18;gGood++;}
  if(best.big) pts*=2;
  gScore+=pts*gMulti;
  spawnParticles(cx,cy,best.type==='don'?DON_COLOR2:KA_COLOR2,best.big?20:12);
  gJudges.push({text:judge,x:cx+20,y:cy-60,color,size,age:0});
  updateHUD();
}

function triggerGameOver(){
  gGameOver=true; gRunning=false; if(gAudio) gAudio.pause();
  const pct=Math.round((gAudio?.currentTime||0)/(gAudio?.duration||1)*100);
  document.getElementById('go-stats').innerHTML=`Arrivato al ${pct}%<br>${gMisses} miss · Combo max: ${gMaxCombo}`;
  document.getElementById('gameover-overlay').classList.remove('hidden');
}

function showResults(){
  if(gFinished) return;
  gFinished=true; gRunning=false; if(gAudio) gAudio.pause();
  const acc=gTotal>0?(gHits/gTotal*100).toFixed(1):'100.0';
  const isFC=gMisses===0;
  const t=document.getElementById('res-title');
  if(isFC&&parseFloat(acc)===100){t.textContent='FULL COMBO! ★';t.className='overlay-title fc';}
  else if(isFC){t.textContent='FULL COMBO!';t.className='overlay-title fc';}
  else if(parseFloat(acc)>=70){t.textContent='COMPLETO!';t.className='overlay-title success';}
  else{t.textContent='INCOMPLETE';t.className='overlay-title danger';}
  document.getElementById('res-song').textContent=`${gMap?.title||''} — ${gMap?.artist||''}`;
  document.getElementById('res-grid').innerHTML=`
    <div class="res-item"><div class="res-val" style="color:${GOLD2}">${gScore.toLocaleString()}</div><div class="res-lbl">SCORE</div></div>
    <div class="res-item"><div class="res-val" style="color:#40c8e0">${acc}%</div><div class="res-lbl">ACCURACY</div></div>
    <div class="res-item"><div class="res-val" style="color:#ff88ff">${gPerfect}</div><div class="res-lbl">PERFECT</div></div>
    <div class="res-item"><div class="res-val" style="color:#ffd93d">${gGreat}</div><div class="res-lbl">GREAT</div></div>
    <div class="res-item"><div class="res-val" style="color:#44ff88">${gGood}</div><div class="res-lbl">GOOD</div></div>
    <div class="res-item"><div class="res-val" style="color:#ff4444">${gMisses}</div><div class="res-lbl">MISS</div></div>
    <div class="res-item"><div class="res-val" style="color:#f5a623">${gMaxCombo}</div><div class="res-lbl">MAX COMBO</div></div>
    <div class="res-item"><div class="res-val" style="color:#ffd93d">×${gMulti}</div><div class="res-lbl">MULTI</div></div>
  `;
  document.getElementById('results-overlay').classList.remove('hidden');
}

// ═══════════════════════════════════════════════════════════
// HUD
// ═══════════════════════════════════════════════════════════
function resetHUD(){
  document.getElementById('hud-score').textContent='0';
  document.getElementById('hud-combo').textContent='';
  document.getElementById('hud-multi').textContent='×1';
  document.getElementById('hud-multi').style.color='#888';
  document.getElementById('life-bar-fill').style.width='100%';
  document.getElementById('progress-fill').style.width='0%';
}
function updateHUD(){
  document.getElementById('hud-score').textContent=gScore.toLocaleString();
  const ce=document.getElementById('hud-combo');
  if(gCombo>1){ce.textContent=gCombo+' COMBO';ce.style.color=gCombo>=30?'#ff4488':gCombo>=20?'#ff9944':gCombo>=10?'#ffd93d':'rgba(255,255,255,.5)';}
  else ce.textContent='';
  const me=document.getElementById('hud-multi');
  me.textContent='×'+gMulti;
  me.style.color=gMulti===4?'#ff4488':gMulti===3?'#ff9944':gMulti===2?'#ffd93d':'#666';
  me.style.textShadow=gMulti>1?`0 0 10px ${me.style.color}`:'none';
  const lf=document.getElementById('life-bar-fill');
  lf.style.width=(gLife/LIFE_MAX*100).toFixed(1)+'%';
  lf.style.background=gLife<25?'#ff2200':gLife<50?'linear-gradient(to right,#ff2200,#ff8800)':'linear-gradient(to right,#ff2200,#ff8800,#44ff88)';
  const lost=Math.floor((1-gLife/LIFE_MAX)*3);
  for(let i=0;i<3;i++){const s=document.getElementById('soul'+i);if(s)s.classList.toggle('empty',i>=3-lost);}
}

// ═══════════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════════
document.querySelectorAll('.touch-zone').forEach(el=>{
  const type=el.dataset.type;
  el.addEventListener('touchstart',e=>{e.preventDefault();el.classList.add('pressed');hitNote(type);},{passive:false});
  el.addEventListener('touchend',e=>{e.preventDefault();el.classList.remove('pressed');},{passive:false});
  el.addEventListener('mousedown',()=>{el.classList.add('pressed');hitNote(type);});
  el.addEventListener('mouseup',()=>el.classList.remove('pressed'));
  el.addEventListener('mouseleave',()=>el.classList.remove('pressed'));
});

document.addEventListener('keydown',e=>{
  if(document.getElementById('screen-game').classList.contains('hidden')) return;
  if(e.repeat) return;
  if(e.key==='Escape'){togglePause();return;}
  if(['f','g'].includes(e.key.toLowerCase())) hitNote('don');
  if(['d','h'].includes(e.key.toLowerCase())) hitNote('ka');
});

// ═══════════════════════════════════════════════════════════
// CONTROLS
// ═══════════════════════════════════════════════════════════
function togglePause(){
  if(!gRunning&&!gPaused) return;
  gPaused=!gPaused;
  if(gPaused){gAudio?.pause();document.getElementById('pause-overlay').classList.remove('hidden');}
  else{gAudio?.play();document.getElementById('pause-overlay').classList.add('hidden');}
}
function restartGame(){if(gSong&&gDiff)startGame(gSong,gDiff);}
function quitGame(){
  if(gAudio){gAudio.pause();gAudio=null;}
  gRunning=false;if(gAnimFrame)cancelAnimationFrame(gAnimFrame);
  showScreen('menu');
}

// ═══════════════════════════════════════════════════════════
// UTILS
// ═══════════════════════════════════════════════════════════
function esc(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

// Stars
(function(){
  const m=document.getElementById('screen-menu');
  for(let i=0;i<60;i++){
    const s=document.createElement('div');s.className='star';
    const sz=1+Math.random()*2;
    s.style.cssText=`width:${sz}px;height:${sz}px;left:${Math.random()*100}%;top:${Math.random()*100}%;background:${Math.random()>.5?GOLD:'#ffffff'};--d:${2+Math.random()*4}s;--delay:-${Math.random()*4}s;opacity:.1;`;
    m.appendChild(s);
  }
})();

showScreen('menu');
</script>
